<svg xmlns="http://www.w3.org/2000/svg" width="1296" height="354" viewBox="0 0 1296 354" role="img" aria-labelledby="title desc">
<title id="title">Observed release checks and hosted research timings</title><desc id="desc">The recorded release passed 126 tests, supports 4 export formats and was checked at 10 viewport widths in Firefox and Chrome. One Quick run took 17.0 seconds; one Detailed run took 18.9 seconds. These are individual smoke tests, not a benchmark.</desc>
<rect width="1296" height="354" rx="18" fill="#f6f5f0"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#2d263b}.label{font-size:16px;font-weight:700;letter-spacing:1.6px;fill:#705488}.heading{font-family:Georgia,serif;font-size:32px}.body{font-size:18px}.muted{fill:#655d6f}.small{font-size:16px}</style>
<text x="44" y="43" class="label">VERIFIED, WITH CONTEXT</text><text x="44" y="87" class="heading">The checks behind the demo.</text><path d="M580 116 V319" stroke="#dfdbe4"/><text x="44" y="189" style="font-size:64px;font-family:Georgia,serif">126</text><text x="44" y="225" class="body muted">automated tests</text><text x="225" y="189" style="font-size:64px;font-family:Georgia,serif">4</text><text x="225" y="225" class="body muted">export formats</text><text x="407" y="189" style="font-size:64px;font-family:Georgia,serif">10</text><text x="407" y="225" class="body muted">viewport widths</text><text x="44" y="284" class="small muted">Recorded release checks · Firefox + Chrome layouts</text><text x="620" y="132" class="label">HOSTED RUNS / 09 SEP 2026</text><text x="620" y="181" class="body">Quick</text><rect x="720" y="162" width="272.0" height="24" rx="4" fill="#705488"/><text x="1005.0" y="181" class="body" style="font-weight:700">17.0s</text><text x="720" y="208" class="small muted">18 sources</text><text x="620" y="248" class="body">Detailed</text><rect x="720" y="229" width="302.4" height="24" rx="4" fill="#2d263b"/><text x="1035.4" y="248" class="body" style="font-weight:700">18.9s</text><text x="720" y="275" class="small muted">18 sources + 3 expanded pages</text><text x="620" y="315" class="small muted">Two individual observations; not a performance benchmark.</text></svg>