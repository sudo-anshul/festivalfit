<svg xmlns="http://www.w3.org/2000/svg" width="1296" height="460" viewBox="0 0 1296 460" role="img" aria-labelledby="title desc">
<title id="title">FestivalFit research loop</title><desc id="desc">Your film profile goes to Gemini search planning, Parallel Search and optional Extract, Gemini assessment and local evidence validation, then a cited report. One optional follow-up researches gaps. Cloud Run hosts the bounded request.</desc>
<rect width="1296" height="460" rx="18" fill="#f6f5f0"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#2d263b}.label{font-size:16px;font-weight:700;letter-spacing:1.6px;fill:#705488}.heading{font-family:Georgia,serif;font-size:32px}.body{font-size:18px}.muted{fill:#655d6f}.small{font-size:16px}</style>
<text x="44" y="44" class="label">THE RESEARCH LOOP</text><text x="44" y="89" class="heading">A bounded agent. An inspectable decision.</text><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#705488"/></marker></defs><rect x="44" y="129" width="216" height="162" rx="12" fill="#ffffff" stroke="#dfdbe4"/><text x="60" y="162" class="label" style="font-size:13px;letter-spacing:.8px">01 / YOUR FILM</text><text x="60" y="197" style="font-size:21px;font-weight:700">A precise profile</text><text x="60" y="231" class="body muted">Runtime, countries,</text><text x="60" y="257" class="body muted">screenings and goals</text><path d="M266 211 H285" stroke="#705488" stroke-width="2" marker-end="url(#arrow)"/><rect x="292" y="129" width="216" height="162" rx="12" fill="#ffffff" stroke="#dfdbe4"/><text x="308" y="162" class="label" style="font-size:13px;letter-spacing:.8px">02 / GEMINI</text><text x="308" y="197" style="font-size:21px;font-weight:700">Plan the search</text><text x="308" y="231" class="body muted">Target current editions</text><text x="308" y="257" class="body muted">and relevant rules</text><path d="M514 211 H533" stroke="#705488" stroke-width="2" marker-end="url(#arrow)"/><rect x="540" y="129" width="216" height="162" rx="12" fill="#ffffff" stroke="#dfdbe4"/><text x="556" y="162" class="label" style="font-size:13px;letter-spacing:.8px">03 / PARALLEL</text><text x="556" y="197" style="font-size:21px;font-weight:700">Retrieve evidence</text><text x="556" y="231" class="body muted">Search + optional</text><text x="556" y="257" class="body muted">full-page extraction</text><path d="M762 211 H781" stroke="#705488" stroke-width="2" marker-end="url(#arrow)"/><rect x="788" y="129" width="216" height="162" rx="12" fill="#ffffff" stroke="#dfdbe4"/><text x="804" y="162" class="label" style="font-size:13px;letter-spacing:.8px">04 / GEMINI + PYTHON</text><text x="804" y="197" style="font-size:21px;font-weight:700">Assess and verify</text><text x="804" y="231" class="body muted">Extract rules; check</text><text x="804" y="257" class="body muted">quotes and conditions</text><path d="M1010 211 H1029" stroke="#705488" stroke-width="2" marker-end="url(#arrow)"/><rect x="1036" y="129" width="216" height="162" rx="12" fill="#d7ef86" stroke="#dfdbe4"/><text x="1052" y="162" class="label" style="font-size:13px;letter-spacing:.8px">05 / YOUR DECISION</text><text x="1052" y="197" style="font-size:21px;font-weight:700">A cited shortlist</text><text x="1052" y="231" class="body muted">Compare, save and</text><text x="1052" y="257" class="body muted">export one snapshot</text><path d="M896 300 V331 H648 V300" fill="none" stroke="#705488" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="583" y="366" class="small muted">One optional follow-up for gaps or alternatives</text><path d="M44 394 H1252" stroke="#dfdbe4"/><text x="44" y="429" class="body">Cloud Run + service identity + Secret Manager</text><text x="1252" y="429" class="body" text-anchor="end">180-second limit · partial findings preserved</text></svg>